<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0A192F">
    <meta name="author" content="Dipun">
    <title>BillFlow | Professional Billing</title>
    <link rel="stylesheet" href="styles.css">
    <!-- PWA Manifest will be added later -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="hidden">
        <!-- Replaced spinner div with your icon -->
        <img src="icon-192.png" alt="Loading..." class="loader-icon">
        <p>Processing...</p>
    </div>

    <!-- Custom Toast Notification -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Login Screen -->
    <div id="loginScreen" class="screen-container">
        <div class="auth-box">
            <!-- Replaced text title with your logo image -->
            <img src="logo.png" alt="BillFlow Logo" class="brand-logo">
            <p class="subtitle">Enter your credentials</p>
            <form id="loginForm">
                <div class="input-group">
                    <label for="userId">User ID</label>
                    <input type="text" id="userId" required autocomplete="off">
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn-primary">Log In</button>
            </form>
            <p id="loginError" class="error-text hidden"></p>
        </div>
    </div>
    
    <!-- Change Password Screen -->
    <div id="changePasswordScreen" class="screen-container hidden">
        <div class="auth-box">
            <h2 class="section-title">Setup New Password</h2>
            <p class="subtitle">For security, please change your default password.</p>
            <form id="changePasswordForm">
                <div class="input-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" required>
                </div>
                <div class="input-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" required>
                </div>
                <button type="submit" class="btn-primary">Update Password</button>
            </form>
            <p id="passwordError" class="error-text hidden"></p>
        </div>
    </div>

    <!-- Dashboard Screen -->
    <div id="dashboardScreen" class="screen-container hidden">
        <div class="app-header">
            <img src="logo.png" alt="BillFlow" class="header-logo">
            <p id="welcomeMessage" class="subtitle"></p>
        </div>
        
        <div class="dashboard-grid">
            <div class="stat-card blue-card">
                <p class="stat-label">Today's Amount</p>
                <h3 class="stat-value">₹<span id="statTodayAmount">0.00</span></h3>
            </div>
            <div class="stat-card">
                <p class="stat-label">Today's Bills</p>
                <h3 class="stat-value" id="statTodayCount">0</h3>
            </div>
            <div class="stat-card green-card">
                <p class="stat-label">Total Bills</p>
                <h3 class="stat-value" id="statTotalCount">0</h3>
            </div>
            <div class="stat-card red-card">
                <p class="stat-label">Today's Due</p>
                <h3 class="stat-value">₹<span id="statTodayDue">0.00</span></h3>
            </div>
            <div class="stat-card red-card">
                <p class="stat-label">Total Due</p>
                <h3 class="stat-value">₹<span id="statTotalDue">0.00</span></h3>
            </div>
        </div>
    </div>

    <!-- Item Management Screen -->
    <div id="itemScreen" class="screen-container hidden">
        <div class="app-header">
            <h2 class="section-title">Item Management</h2>
        </div>
        
        <!-- Add Item Box -->
        <div class="card-box">
            <h3 class="card-title">Add New Item</h3>
            <form id="addItemForm">
                <div class="input-group">
                    <label>Item Name</label>
                    <input type="text" id="itemName" required autocomplete="off">
                </div>
                <div class="input-grid">
                    <div class="input-group">
                        <label>Price (₹)</label>
                        <input type="number" id="itemPrice" step="0.01" required>
                    </div>
                    <div class="input-group">
                        <label>GST (%)</label>
                        <input type="number" id="itemGst" value="0" min="0" max="100" required>
                    </div>
                </div>
                <button type="submit" class="btn-primary">Save Item</button>
            </form>
        </div>

        <!-- Search & List Box -->
        <div class="card-box" style="margin-top: 20px;">
            <input type="text" id="searchItem" class="search-bar" placeholder="Search items...">
            <div id="itemListView" class="item-list">
                <!-- Items will be injected here via JavaScript -->
                <p style="text-align:center; color: #64748B; font-size: 0.9rem;">No items found.</p>
            </div>
        </div>
    </div>

    <!-- Screens for later phases (Hidden for now) -->
    <div id="billingScreen" class="screen-container hidden"><h2 class="section-title">Billing Area</h2></div>
    <div id="dueScreen" class="screen-container hidden"><h2 class="section-title">Due Bills</h2></div>
    <div id="historyScreen" class="screen-container hidden"><h2 class="section-title">History</h2></div>

    <!-- Bottom Navigation Bar -->
    <nav id="bottomNav" class="bottom-nav hidden">
        <button class="nav-item active" onclick="switchTab('dashboardScreen', this)">Home</button>
        <button class="nav-item" onclick="switchTab('itemScreen', this)">Items</button>
        <button class="nav-item" onclick="switchTab('billingScreen', this)">Bill</button>
        <button class="nav-item" onclick="switchTab('dueScreen', this)">Dues</button>
        <button class="nav-item" onclick="switchTab('historyScreen', this)">History</button>
    </nav>

    <script src="app.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => console.log('Service Worker registered', reg))
                    .catch((err) => console.log('Service Worker not registered', err));
            });
        }
    </script>
    
</body>
</html>
